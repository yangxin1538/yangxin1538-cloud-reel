<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudReel</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#222}
input,select,textarea{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button{padding:10px 18px;cursor:pointer;margin-right:8px}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap;word-break:break-word}
h2{margin-top:32px}
</style>
</head>
<body>
<h1>CloudReel v0.2</h1>
<p>CD2 网盘 → STRM → Emby / Jellyfin，带 NextEmby 分流网关与 NextFind 发现诊断。</p>

<h2>配置与扫描</h2>
<label>源目录（CD2 挂载）<input id="source_root"></label>
<label>STRM 输出目录<input id="strm_root"></label>
<label>Emby 上游（网关用，如 http://127.0.0.1:8096）<input id="emby_upstream" placeholder="留空表示不启用网关"></label>
<label>定时扫描（分钟，0=关闭）<input id="scan_interval_minutes" type="number"></label>
<button onclick="save()">保存配置</button>
<button onclick="doScan()">立即扫描</button>

<h2>分流试算</h2>
<label>STRM 内容（文件路径或直链）<input id="strm" placeholder="/CloudNAS/电影/片名 (2024).mkv"></label>
<label>用户<input id="user" placeholder="admin"></label>
<label>模式
<select id="mode"><option value="smart">smart 智能分流</option><option value="designated">designated 指定网盘</option><option value="direct115">direct115 115直连</option><option value="direct123">direct123 123直连</option><option value="directguangya">directguangya 光鸭直连</option><option value="redirect302">redirect302 302跳转</option></select>
</label>
<button onclick="resolve()">试算分流</button>
<p><a id="playlink" href="#" target="_blank">播放链接（试算后生成）</a></p>

<h2>发现（NextFind）</h2>
<textarea id="ingest_text" rows="4" placeholder="粘贴频道/分享链接文本，每行一条"></textarea>
<button onclick="ingest()">导入发现</button>
<label>剧名<input id="show" placeholder="三体"></label>
<label>季<input id="season" type="number" value="1"></label>
<label>总集数<input id="total" type="number" value="10"></label>
<button onclick="diagnose()">缺集诊断</button>

<h2>状态</h2>
<pre id="status">加载中…</pre>
<p>
<button onclick="show('sources')">源</button>
<button onclick="show('users')">用户</button>
<button onclick="show('cache')">缓存</button>
<button onclick="show('logs')">日志</button>
<button onclick="show('plugins')">插件</button>
<button onclick="show('discovery')">发现</button>
<button onclick="clearCache()">清空缓存</button>
</p>
<pre id="detail"></pre>

<script>
async function j(u,o){const r=await fetch(u,o);return r.json();}
async function load(){
  const s=await j('/api/status'); const c=s.config;
  source_root.value=c.source_root; strm_root.value=c.strm_root;
  emby_upstream.value=c.emby_upstream||''; scan_interval_minutes.value=c.scan_interval_minutes;
  status.textContent=JSON.stringify(s,null,2);
}
async function save(){
  await j('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({source_root:source_root.value,strm_root:strm_root.value,
      emby_upstream:emby_upstream.value,scan_interval_minutes:Number(scan_interval_minutes.value)})});
  load();
}
async function doScan(){status.textContent='扫描中…';status.textContent=JSON.stringify(await j('/api/scan',{method:'POST'}),null,2);load();}
async function resolve(){
  const r=await j('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({strm:strm.value,user:user.value||null,mode:mode.value})});
  detail.textContent=JSON.stringify(r,null,2);
  if(r.ok) playlink.href='/play?path='+encodeURIComponent(strm.value)+(user.value?'&user='+encodeURIComponent(user.value):'');
}
async function ingest(){detail.textContent=JSON.stringify(await j('/api/discovery/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:ingest_text.value})}),null,2);}
async function diagnose(){detail.textContent=JSON.stringify(await j('/api/discovery/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({show:show.value,season:Number(season.value),total_episodes:Number(total.value)})}),null,2);}
async function show(k){detail.textContent=JSON.stringify(await j('/api/'+k),null,2);}
async function clearCache(){detail.textContent=JSON.stringify(await j('/api/cache/clear',{method:'POST'}),null,2);}
load();
</script>
</body>
</html>
