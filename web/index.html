<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudReel</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}
input,select{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button{padding:10px 18px;cursor:pointer}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>CloudReel</h1>
<p>CloudDrive2 网盘 → STRM → Emby / Jellyfin</p>

<h2>配置</h2>
<label>源目录（CD2 挂载）<input id="source_root"></label>
<label>STRM 输出目录<input id="strm_root"></label>
<label>STRM 模式
<select id="strm_mode"><option value="file">file：写源文件绝对路径</option><option value="url">url：写直链地址</option></select>
</label>
<label>直链前缀（url 模式用）<input id="strm_base_url" placeholder="http://..."></label>
<label>定时扫描（分钟，0=关闭）<input id="scan_interval_minutes" type="number"></label>
<button onclick="save()">保存配置</button>
<button onclick="doScan()">立即扫描</button>

<h2>状态</h2>
<pre id="status">加载中…</pre>

<script>
async function load(){
  const r = await fetch('/api/status'); const j = await r.json();
  const c = j.config;
  source_root.value=c.source_root; strm_root.value=c.strm_root;
  strm_mode.value=c.strm_mode; strm_base_url.value=c.strm_base_url||'';
  scan_interval_minutes.value=c.scan_interval_minutes;
  status.textContent = JSON.stringify(j, null, 2);
}
async function save(){
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({source_root:source_root.value,strm_root:strm_root.value,
      strm_mode:strm_mode.value,strm_base_url:strm_base_url.value,
      scan_interval_minutes:Number(scan_interval_minutes.value)})});
  load();
}
async function doScan(){
  status.textContent='扫描中…';
  const r = await fetch('/api/scan',{method:'POST'}); const j = await r.json();
  status.textContent = JSON.stringify(j, null, 2); load();
}
load();
</script>
</body>
</html>
